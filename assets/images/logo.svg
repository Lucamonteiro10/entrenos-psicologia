<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C98A81"/>
      <stop offset="100%" stop-color="#9E635C"/>
    </linearGradient>
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B5A1"/>
      <stop offset="100%" stop-color="#7B8C77"/>
    </linearGradient>
  </defs>

  <!-- Símbolo Minimalista de Conexão / Vínculo / Dois caminhos que se encontram -->
  <g transform="translate(10, 14)">
    <!-- Círculo de fundo suave -->
    <circle cx="26" cy="26" r="24" fill="#FAF4F0" stroke="#F0E3DC" stroke-width="1"/>
    
    <!-- Duas curvas orgânicas entrelaçadas simbolizando "Entre Nós" (psicóloga e paciente em conexão) -->
    <path d="M 16 34 C 14 20, 26 14, 32 20 C 37 25, 30 36, 22 32 C 18 29, 23 21, 35 24" 
          fill="none" 
          stroke="url(#roseGradient)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Ponto de toque/cuidado em verde suave -->
    <circle cx="34" cy="22" r="2.8" fill="url(#sageGradient)"/>
    <circle cx="18" cy="30" r="1.8" fill="#C98A81" opacity="0.7"/>
  </g>

  <!-- Tipografia do Logotipo -->
  <!-- "ENTRE NÓS" em fonte serifada elegante -->
  <text x="74" y="38" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="25" font-weight="600" letter-spacing="3" fill="#2D2524">
    ENTRE NÓS
  </text>
  
  <!-- "PSICOLOGIA • THAMIRES MONTEIRO AVELAR" em sem serifa delicada -->
  <text x="75" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="500" letter-spacing="3.2" fill="#8C7B78">
    PSICOLOGIA CLÍNICA
  </text>
</svg>
